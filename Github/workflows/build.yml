name: Build Hark Home APK
on:
  push:
    branches: [main]
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip the newest project zip
        run: |
          ls | grep -E '^HarkHome_Launcher.+zip$' | while IFS= read -r z; do
            v=$(unzip -p "$z" app/build.gradle | grep -Eo 'versionCode [0-9]+' | grep -Eo '[0-9]+')
            echo "${v:-0} $z"
          done | sort -n | tail -1 | cut -d' ' -f2- > best.txt
          echo "Building $(cat best.txt)"
          unzip -o "$(cat best.txt)"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: HarkHome-apk
          path: app/build/outputs/apk/debug/app-debug.apk
