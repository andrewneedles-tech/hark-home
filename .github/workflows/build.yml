name: Build Hark Home APK
on:
push:
branches: [main]
workflow_dispatch: {}
jobs:
build:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4
- name: Unzip the newest project zip
run: |
best=""; bestv=-1
for z in HarkHome_Launcher*.zip; do
v=$(unzip -p "$z" app/build.gradle | grep -o 'versionCode [0-9]' | grep -o '[0-9]' || echo 0)
if [ "$v" -gt "$bestv" ]; then bestv=$v; best=$z; fi
done
echo "Building $best (versionCode $bestv)"
unzip -o "$best"
- uses: actions/setup-java@v4
with:
distribution: temurin
java-version: "17"
- uses: gradle/actions/setup-gradle@v4
with:
gradle-version: "8.7"
- name: Build
run: gradle assembleDebug --no-daemon
- uses: actions/upload-artifact@v4
with:
name: HarkHome-apk
path: app/build/outputs/apk/debug/app-debug.apk
